# The JDK path is deliberately not here: it is different on every machine and belongs in
# ~/.gradle/gradle.properties (org.gradle.java.home) or in JAVA_HOME.
#
# Release builds are the slow ones — R8 shrinks and optimises the whole app on every source
# change — so the settings here are about not paying for the same work twice: a daemon that
# stays up, a build cache, and the configuration cache, which skips re-reading the build
# scripts entirely when they have not changed. 3 GB was also tight for R8 on this module;
# the metaspace cap keeps a long-lived daemon from growing without end.
# Tuned for modern multi-core, high-RAM systems (12 logical processors, 24GB RAM)
org.gradle.jvmargs=-Xmx8192m -XX:+UseG1GC -XX:MaxMetaspaceSize=1536m -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.workers.max=12

# Kotlin daemon heap size: avoids frequent GC pauses during compilation
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseG1GC

android.useAndroidX=true
android.nonTransitiveRClass=true

# Speed up R8 and compilation
kotlin.incremental=true
android.enableR8.fullMode=true

kotlin.code.style=official
